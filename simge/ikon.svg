<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1b2a4a"/>
      <stop offset="55%" stop-color="#16233d"/>
      <stop offset="100%" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="vurgu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5aa9ff"/>
      <stop offset="100%" stop-color="#3d7fd6"/>
    </linearGradient>
  </defs>

  <!-- yuvarlatılmış kare zemin (macOS ölçüsüne yakın) -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#zemin)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="6"/>

  <!-- ilan kartı: kalın kenar, küçük boyutta da okunur -->
  <rect x="228" y="236" width="416" height="520" rx="46" fill="#f2f6fc"/>
  <rect x="228" y="236" width="416" height="520" rx="46" fill="none"
        stroke="#0d1524" stroke-opacity="0.35" stroke-width="10"/>
  <!-- kartın üstünde başlık şeridi -->
  <rect x="296" y="316" width="280" height="40" rx="20" fill="#33456b"/>
  <rect x="296" y="404" width="216" height="30" rx="15" fill="#8fa2c4"/>
  <rect x="296" y="474" width="256" height="30" rx="15" fill="#8fa2c4"/>
  <rect x="296" y="544" width="176" height="30" rx="15" fill="#8fa2c4"/>

  <!-- eşleşme onayı: sağ altta kalın tik -->
  <circle cx="662" cy="672" r="188" fill="url(#vurgu)"/>
  <circle cx="662" cy="672" r="188" fill="none" stroke="#101a2e" stroke-width="26"/>
  <path d="M576 674 l58 62 128 -146" fill="none" stroke="#ffffff" stroke-width="56"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
