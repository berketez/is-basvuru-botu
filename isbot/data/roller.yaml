# --- kontrol / otomasyon / mekatronik ------------------------------------------
# NEDEN EKLENDİ: 16 ailenin tamamı yazılım-veri eksenindeydi. Kontrol mühendisi
# hiçbirine tutmuyor, `genel_yazilim`a düşüyordu — ve o aile "engineer|developer|
# analyst|specialist" diye TARADIĞI için kısa listeye "People Ops Onboarding
# Specialist" gibi ilanlar giriyordu. Türkiye'de bu alan işe alımın merkezinde.
# Başlık kalıpları hem İngilizce hem Türkçe: TR panolarında ilan başlığı Türkçedir.
kontrol_otomasyon:
  tetik_guclu: ["control systems", "LQR", "adaptive control", "PLC", "autonomous systems"]
  tetik: ["PID", "Simulink", "state-space", "sensor fusion", "LabVIEW", "ROS",
          "Robotics", "system identification", "MATLAB"]
  tetik_min: 2
  agirlik: 1.0
  # ÖLÇÜLDÜ (kariyer.net, "kontrol mühendisi"): 51 ilanın tamamı KALİTE KONTROL /
  # kontrol odası operatörlüğüydü. Türkçede "kontrol" hem control-systems hem
  # quality-control demek; çıplak "kontrol mühendisi" bu alanı getirmiyor. Bu yüzden
  # sorgular ayırt edici sözcüklere dayandırıldı (otomasyon, mekatronik, gömülü).
  # Bu adların HEPSİ kariyer.net sitemap'inde kanonik yol olarak DOĞRULANDI
  # (data/kariyernet-sitemap.json, 60.441 yol). Karşılığı olmayan ad site tarafından
  # sessizce genel listeye düşürülüyor ve alakasız ilan getiriyor — bu yüzden
  # "kontrol sistemleri mühendisi" LİSTEDE YOK: sitede böyle bir kategori yok.
  tr_pozisyonlar: ["otomasyon mühendisi", "mekatronik mühendisi",
                   "elektrik otomasyon mühendisi", "elektrik elektronik mühendisi",
                   "gömülü yazılım mühendisi", "gömülü sistem mühendisi"]
  # `kontrol` Türkçe kalıpta YALNIZ "kontrol sistem..." biçiminde geçer ve "kalite
  # kontrol" öncüsü negatif bakışla dışlanır — yoksa her kalite kontrol ilanı
  # bu ailenin tam puanını alır.
  en_pozisyonlar: ["control systems engineer", "automation engineer"]
  basliklar: ['(?i)(?:\b(control (system|engineer|software)|controls engineer|automation|mechatronic|robotic|motion control|autonomous|adas|plc|scada|otomasyon|mekatronik|robotik|(?<!kalite )kontrol sistem\w*))|\b(?:elektronik mühendis|elektrik elektronik|donanım mühendis|donanım tasarım|elektro.?optik|sinyal işleme|güç elektroniği)\w*']

# --- havacılık / uzay / savunma sanayii ----------------------------------------
havacilik_savunma:
  tetik_guclu: ["flight dynamics", "avionics", "UAV", "autopilot", "rocketry", "satellite",
                "propulsion"]
  tetik: ["aerospace", "defence industry", "hardware-in-the-loop", "control systems",
          "sensor fusion", "Simulink"]
  tetik_min: 2
  agirlik: 1.0
  # "savunma sanayi" ve "havacılık" kariyer.net'te POZİSYON değil SEKTÖR sayfası —
  # ama tam da bu yüzden değerli: savunma/havacılık firmalarının o sektördeki tüm
  # ilanlarını tek sayfada veriyorlar. Türkiye'de bu şirketlerin (ASELSAN, TUSAŞ,
  # ROKETSAN…) herkese açık ATS ucu YOK; bu sektör sayfaları onlara ulaşan tek
  # robots-izinli kanal. Hepsi sitemap'te doğrulandı.
  tr_pozisyonlar: ["savunma sanayi", "havacılık", "aviyonik mühendisi",
                   "simülasyon mühendisi", "sistem mühendisi", "test mühendisi"]
  # EK/ÇOĞUL: hem Türkçe ("savunma sistemleri", "uçuşa") hem İngilizce ("Avionics",
  # "drones", "flight dynamics") gövdeye ek alır. Kapanış \b'si bunları KESİYORDU —
  # ölçüldü: "Avionics Engineer" başlığı bu aileye hiç eşleşmiyordu. Kapanış sınırı
  # yerine \w* kullanılır; açılış \b korunur ki kelime ortasında eşleşme olmasın.
  en_pozisyonlar: ["aerospace engineer", "avionics engineer"]
  basliklar: ['(?i)(?:(\b(aerospace|avionic|aeronautic|uav|drone|unmanned|satellite|spacecraft|propulsion|defen[cs]e|gnc)\w*|\bflight (control|dynamic|software|test|mechanic)\w*|\bguidance (and )?navigation|\b(havacılık|aviyonik|uçuş|insansız hava|savunma|füze|roket|uydu|hava arac)\w*))|\b(?:elektro.?optik|radar|güdüm|harp mühendis|balistik)\w*']

# =============================================================================
# --- YAZILIM DIŞI MESLEK AİLELERİ ---
