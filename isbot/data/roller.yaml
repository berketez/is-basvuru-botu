# Rol aileleri — CV'de tespit edilen yeteneklerden TÜRETİLİR.
#
# tetik_guclu: TANIMLAYICI yetenekler — biri bile varsa aile etkinleşir.
#              (SwiftUI/UIKit = iOS uygulaması yazan biri; Solidity = blockchain'ci)
# tetik      : DESTEKLEYİCİ yetenekler — tek başına yetmez, en az `tetik_min` tane gerek.
#
# NEDEN BU AYRIM: Başta tek yetenek koca bir kariyer ailesini açıyordu. Berke'nin
# CV'sinde "Swift" yalnızca "ObjC/Swift/C++ dispatch resolution" bağlamında geçiyor —
# yani Swift ikililerini TERSİNE MÜHENDİSLİKLE çözüyor, uygulama yazmıyor. Motor onu
# iOS geliştiricisi sandı ve kısa listeye iOS/Android ilanları geldi (73,6 ve 51,1 puan).
# Artık Swift tek başına yetmiyor; SwiftUI/UIKit gibi uygulama çatıları gerekiyor.
#
# agirlik  : etkinleşirse taşıdığı ağırlık (0-1)
# basliklar: ilan başlığında aranan kalıplar (tek satır olmalı)
# tr_pozisyonlar: Türk panoları için Türkçe pozisyon adları (kanonik olmalı)

mobil:
  tetik_guclu: ["SwiftUI", "UIKit", "Flutter", "React Native"]
  tetik: ["Swift", "Kotlin"]
  tetik_min: 2
  agirlik: 1.0
  tr_pozisyonlar: ["mobil uygulama geliştirici", "android geliştirici", "ios geliştirici"]
  basliklar: ['(?i)\b(ios|android|mobile|swift|kotlin|flutter|react native)\b']

oyun:
  tetik_guclu: ["Unity", "Unreal"]
  tetik: ["C#"]
  tetik_min: 2
  agirlik: 1.0
  tr_pozisyonlar: ["oyun geliştirici", "yazılım mühendisi"]
  basliklar: ['(?i)\b(game|unity|unreal|gameplay|graphics engineer|technical artist)\b']

