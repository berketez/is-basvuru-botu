# çıkıyordu. Bu aileler o boşluğu kapatır.
#
# tr_pozisyonlar UYDURULMADI: her biri kariyer.net'in kendi sitemap'inde
# kanonik yol olarak DOĞRULANDI (data/kariyernet-sitemap.json). Karşılığı
# olmayan ad site tarafından sessizce genel listeye düşürülüyor ve alakasız
# ilan getiriyor — ölçülen bir hata, varsayım değil.
#
# basliklar hem Türkçe hem İngilizce daldan oluşur; Türkçe dal ek toleranslıdır
# (\w*), çünkü Türkçe eklemeli bir dil: "mühendis" -> "mühendisi".
