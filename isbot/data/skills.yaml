# --- kontrol & otomasyon -------------------------------------------------------
# NEDEN EKLENDİ: sözlükte kontrol mühendisliği hiç yoktu. Türk bir kontrol/otomasyon
# mühendisinin CV'sinde MATLAB dışında TEK bir kalem tanınmıyordu; motor onu
# "genel yazılımcı" sayıp uzaktan web ilanları öneriyordu.
#
# İKİ KURAL:
#  1) KANONİK AD İNGİLİZCE. Kanonik ad hem uluslararası arama sorgusu olarak
#     kullanılıyor hem de ilan metninde aranıyor. Türkçe kanonik ("uçuş dinamiği")
#     yazılırsa Greenhouse/Lever sorgusu anlamsız olur ve İngilizce ilanda hiç
#     eşleşmez. Türkçe karşılık EŞANLAMLI olarak yazılır — TR panolarında o tutar.
#  2) EŞANLAMLILAR DÜZ METİN. re.escape edilir, regex DEĞİL. Tireli/boşluklu
#     varyantlar ayrı ayrı: "closed-loop" VE "closed loop".
kontrol_otomasyon:
  "control systems": ["control system", "control systems", "control theory", "control engineering",
                      "closed-loop", "closed loop", "feedback control",
                      "kontrol sistem", "kontrol sistemleri", "kontrol teorisi",
                      "kapalı çevrim", "geri besleme", "kontrol mühendis"]
  PID: ["pid control", "pid controller", "pid kontrol", "pid denetleyici"]
  LQR: [lqr, lqg, "linear quadratic"]
  "adaptive control": ["adaptive control", mrac, "model reference adaptive", "gain scheduling",
                       "robust control", "optimal control", "sliding mode",
                       "adaptif kontrol", "model referans adaptif", "gürbüz kontrol",
                       "optimal kontrol", "kayan kipli"]
  "state-space": ["state-space", "state space", "kalman", "kalman filter", "observer design",
                  "durum uzayı", "kalman filtresi", "gözlemci tasar"]
  Simulink: [simulink, simscape, stateflow, "model-based design", "model based design",
             "matlab onramp"]
  LabVIEW: [labview, veristand]
  PLC: [plc, scada, "ladder logic", "tia portal", codesys, "industrial automation",
        "endüstriyel otomasyon"]
  "system identification": ["system identification", "system dynamics", "plant model",
                            "sistem tanımlama", "sistem dinamiği", "sistem dinamiğini"]
  "autonomous systems": ["autonomous system", "autonomous systems", "autonomous driving",
                         "self-driving", "self driving", adas, "autonomous control",
                         "otonom sistem", "otonom sistemler", "otonom sürüş", "otonom araç",
                         "otonom kontrol", "otonom iniş"]
  "sensor fusion": ["sensor fusion", imu, ahrs, "inertial measurement",
                    "sensör füzyon", "ataletsel ölçüm"]
  ROS: [ros2, "robot operating system"]
  Robotics: [robotics, "motion planning", manipulator, kinematics,
             robotik, robotiğ, "manipülatör", "kinematik", "yörünge planlama"]

