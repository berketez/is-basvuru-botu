# =============================================================================
# --- YAZILIM DIŞI MESLEK ALANLARI ---
# =============================================================================
# NEDEN: sözlüğün tamamı yazılım/mühendislik eksenindeydi. Tıp, hukuk, inşaat,
# muhasebe, lojistik, gıda, eğitim, turizm, tekstil, enerji, tarım, denizcilik,
# madencilik, satış ve İK alanlarında TEK kalem yoktu; o alanlardan gelen bir CV
# motorda sessizce çöküyordu (hiç yetenek tanınmıyor, güçlü liste boş kalıyor).
#
# KAYNAK: ESCO (AB meslek sınıflaması) yalnız KAPSAM HARİTASI olarak kullanıldı,
# veri kaynağı olarak DEĞİL. İki ölçülen sebep: (1) ESCO'da Türkçe yok — API'ye
# language=tr verilince hata değil, sessizce boş sonuç dönüyor; (2) ESCO "skill"
# etiketleri fiil öbeği ("operate welding equipment"), bu motorun aradığı türden
# anahtar sözcük değil. Kalemler elle küratörlendi.
#
# ÇAKIŞMA DENETİMİ YAPILDI: mevcut kanoniklerle kesişim yok. Yazılım bağlamında
# yanlış eşleşen terimler bilerek unvanlaştırıldı ("onboarding" -> "Onboarding
# Specialist") ya da dışarıda bırakıldı (blockchain'deki `foundry` metal dökümüne,
# Ansible'daki `chef` aşçılığa yazılmadı).
# Ayrıntılı gerekçe ve bilinen çakışmalar: docs/skills-genisletme-onerisi.yaml
# =============================================================================

