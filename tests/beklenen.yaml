# Benchmark beklentileri — CV'ler ELLE okunarak yazıldı, motorun çıktısına bakılarak DEĞİL.
# Döngüsel doğrulamayı önlemek için önce beklenen yazılır, sonra motor koşulur.
#
# deneyim   : beklenen profesyonel yıl (tolerans ±1.5)
# kidem     : beklenen kıdem TAVANI (aranacak en üst seviye). DİKKAT: junior bir aday
#             bir kademe yukarı bakabildiği için junior CV'de tavan "mid" olur — bu
#             tasarım gereğidir, hata değil.
# olmali    : CV'de açıkça yazan, mutlaka tespit edilmesi gereken yetenekler
# olmamali  : CV'de OLMAYAN, tespit edilirse yanlış pozitif sayılacak yetenekler
# alan      : ilk sonuçların ilgili olması beklenen alan anahtar kelimeleri
# negatif   : true ise bu CV yazılım havuzundan neredeyse hiç sonuç ALMAMALI

1_junior_frontend:
  deneyim: 4.2
  kidem: mid
  olmali: [JavaScript, HTML, CSS, WordPress, Figma]
  olmamali: [PyTorch, Kubernetes, Ghidra, Solidity]
  alan: [frontend, web, javascript, react, ui]

